<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Marvel Cinematic Universe Graph</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars */
        }
        #graph-container {
            width: 100vw;
            height: 90vh;
        }
    </style>
</head>
<body>
    <div id="graph-container"></div>
    <div id="controls">
        <label><input checked id="movies" type="checkbox" class="filter"> Movies</label>
        <label><input checked id="characters" type="checkbox" class="filter"> Characters</label>
        <label><input checked id="phase1" type="checkbox" class="filter"> Phase 1</label>
        <label><input checked id="phase2" type="checkbox" class="filter"> Phase 2</label>
        <label><input checked id="phase3" type="checkbox" class="filter"> Phase 3</label>
        <label><input checked id="phase4" type="checkbox" class="filter"> Phase 4</label>
        <label><input checked id="phase5" type="checkbox" class="filter"> Phase 5</label>
        <label><input checked id="phase6" type="checkbox" class="filter"> Phase 6</label>
        <label><input checked id="whatif" type="checkbox" class="filter"> What if...</label>
        <label><input checked id="netflix" type="checkbox" class="filter"> Netflix</label>
        <label><input checked id="fox" type="checkbox" class="filter"> Fox</label>
        <label><input checked id="abc" type="checkbox" class="filter"> ABC</label>
        <label><input checked id="hulu" type="checkbox" class="filter"> Hulu</label>
        <label><input checked id="sony" type="checkbox" class="filter"> Sony-verse</label>
        <label><input checked id="raimi" type="checkbox" class="filter"> Raimi-verse</label>
        <label><input checked id="webb" type="checkbox" class="filter"> Webbi-verse</label>
        <label><input checked id="classic" type="checkbox" class="filter"> Marvel Classic movies</label>
    </div>
    <script src="jquery.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="script_filter.js"></script>
    <link rel="stylesheet" href="stylesheet_filter.css" />
</body>
</html>
